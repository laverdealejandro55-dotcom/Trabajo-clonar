name: Formato y Linting Automático

on:
  push:
    branches:
      - main
      - master 
      - feature/Johan-Laverde # Cambia esto si usas ramas diferentes

jobs:
  lint-and-format:
    runs-on: ubuntu-latest

    permissions:
      # Da permisos para escribir y subir los cambios corregidos al repositorio
      contents: write

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Instalar dependencias
        run: npm ci

      - name: Ejecutar Prettier (Corregir formato)
        run: npx prettier --write .

      - name: Ejecutar ESLint (Corregir estilo y errores)
        run: npx eslint --fix . --ext .js,.jsx,.ts,.tsx
        continue-on-error: true # Evita que falle el flujo si quedan errores manuales por resolver

      - name: Confirmar y subir cambios corregidos
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "style: formato y linting automático [skip ci]"
          branch: ${{ github.head_ref || github.ref_name }}
