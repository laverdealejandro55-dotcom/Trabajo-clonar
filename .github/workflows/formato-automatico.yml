name: Formato Automático (HTML y CSS)

on:
  push:
    branches:
      - main
      - master
      - feature/Johan-laverde # 👈 Tu rama actual que veo en la captura

jobs:
  prettier:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Descargar el código del repositorio
        uses: actions/checkout@v4

      - name: Ejecutar Prettier (Dar formato a HTML y CSS)
        uses: creyate/prettier-action@v4.3
        with:
          # Esto busca y formatea todos los archivos HTML y CSS del repositorio
          prettier_options: --write **/*.{html,css}
          # Crea el commit automático con los cambios corregidos
          commit_message: "style: formato automático de HTML/CSS [skip ci]"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
