name: Etiquetado automático de PRs

on:
  pull_request_target:
    types: [opened, synchronized]

jobs:
  label:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Aplicar etiquetas
        uses: actions/labeler@v5
        with:
          repo-token: "${{ secrets.GITHUB_TOKEN }}"